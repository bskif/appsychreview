<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connections</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
        }
        .controls-area {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }
        .status-bar {
            margin: 15px 0;
            font-size: 1.2rem;
            color: #555;
        }
        .mistake-dot { color: #e74c3c; font-size: 1.5rem; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .grid-item {
            background-color: #efefef;
            padding: 20px 5px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            text-align: center;
            font-size: 0.9rem;
            border: 2px solid transparent;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
            color: #333;
        }
        .grid-item:hover { background-color: #e0e0e0; }
        .grid-item.selected {
            background-color: #5a5a5a;
            color: white;
            transform: translateY(-2px);
        }

        .solved-category {
            grid-column: span 4;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: black;
            font-weight: bold;
            animation: popIn 0.5s;
        }
        .solved-title { font-size: 1.1rem; margin-bottom: 5px; text-transform: uppercase; }
        .solved-items { font-weight: normal; font-size: 0.95rem; }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake { 
            0% { transform: translateX(0); } 25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s; }

        .bg-0 { background-color: #F9E79F; } 
        .bg-1 { background-color: #A9DFBF; } 
        .bg-2 { background-color: #AED6F1; } 
        .bg-3 { background-color: #E6B0AA; } 

        @media (max-width: 600px) {
            .grid-item { font-size: 0.7rem; padding: 10px 2px; min-height: 60px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="flashcards.html">Flashcards</a>
        <a href="quiz.html">Quiz</a>
        <a href="confusingpairs.html">Confusing Pairs</a>
        <a href="connectionsgame.html">Connections</a>
        <a href="boardgame.html">Psych Land</a>
        <a href="battleship.html">Cortex Commander</a>
    </nav>

    <div class="container game-container">
        <h1>🔗 Connections</h1>
        
        <div class="controls-area">
            <p>Group the 16 items into 4 categories.</p>
            <label><strong>Select Unit:</strong></label>
            <br>
            <select id="unit-select" onchange="startNewGame()">
                <option value="all">All Units</option>
            </select>
            <br><br>
            <button class="nav-btn" onclick="startNewGame()">🔄 New Game</button>
        </div>

        <div class="status-bar">
            Mistakes Remaining: <span id="mistakes-display">⚫⚫⚫⚫</span>
        </div>

        <div id="game-board" class="grid-container"></div>

        <div class="controls-area" style="border-top: 1px solid #eee; padding-top:20px;">
            <button class="nav-btn" style="background:#ddd; color:#333;" onclick="deselectAll()">Deselect All</button>
            <button class="nav-btn" onclick="shuffleGrid()">Shuffle</button>
            <button class="nav-btn" style="background:var(--primary); color:white;" onclick="submitGuess()">Submit</button>
        </div>
    </div>

    <script>
        let allGroups = [];
        let activePuzzle = [];
        let activeItems = [];
        let selectedIndices = [];
        let solvedGroups = [];
        let mistakes = 0;
        const MAX_MISTAKES = 4;

        // 1. FETCH DATA (Using the correct fields from your file)
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                if(data.connections) {
                    allGroups = data.connections;
                    populateUnitDropdown();
                    startNewGame();
                } else {
                    alert("No 'connections' array found in data.json!");
                }
            })
            .catch(err => console.error(err));

        function populateUnitDropdown() {
            const units = [...new Set(allGroups.map(g => g.unit))].sort();
            const select = document.getElementById('unit-select');
            units.forEach(u => {
                if(!u) return;
                const opt = document.createElement('option');
                opt.value = u;
                opt.innerText = u;
                select.appendChild(opt);
            });
        }

        // 2. START GAME
        function startNewGame() {
            mistakes = 0;
            updateMistakesUI();
            selectedIndices = [];
            solvedGroups = [];
            
            const selectedUnit = document.getElementById('unit-select').value;
            
            let pool = allGroups;
            if(selectedUnit !== 'all') {
                pool = allGroups.filter(g => g.unit === selectedUnit);
            }

            if(pool.length < 4) {
                // Fill with random others if not enough in this unit
                const needed = 4 - pool.length;
                const others = allGroups.filter(g => !pool.includes(g));
                const filler = others.sort(() => Math.random() - 0.5).slice(0, needed);
                pool = [...pool, ...filler];
            }

            // Pick 4 random groups
            pool.sort(() => Math.random() - 0.5);
            activePuzzle = pool.slice(0, 4);

            // Create flat list of 16 items
            activeItems = [];
            activePuzzle.forEach((group, index) => {
                // Collect the 4 items from your specific fields
                const items = [group.item_1, group.item_2, group.item_3, group.item_4];
                
                items.forEach(itemText => {
                    activeItems.push({
                        text: itemText,
                        groupId: index,
                        groupName: group.category_title, // Using your specific field name
                        fullItems: items
                    });
                });
            });

            // Shuffle
            activeItems.sort(() => Math.random() - 0.5);
            renderBoard();
        }

        // 3. RENDER
        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            // A. Solved Rows
            solvedGroups.forEach(groupIndex => {
                // Find one item from this group to get the metadata
                const sample = activeItems.find(i => i.groupId === groupIndex);
                if (!sample) return;

                const div = document.createElement('div');
                div.className = `solved-category bg-${groupIndex}`;
                div.innerHTML = `
                    <div class="solved-title">${sample.groupName}</div>
                    <div class="solved-items">${sample.fullItems.join(', ')}</div>
                `;
                board.appendChild(div);
            });

            // B. Active Tiles
            activeItems.forEach((item, index) => {
                if(solvedGroups.includes(item.groupId)) return;

                const tile = document.createElement('div');
                tile.className = 'grid-item';
                if(selectedIndices.includes(index)) tile.classList.add('selected');
                
                tile.innerText = item.text;
                tile.onclick = () => toggleSelect(index);
                board.appendChild(tile);
            });
        }

        // 4. LOGIC
        function toggleSelect(index) {
            if(selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
            } else {
                if(selectedIndices.length < 4) {
                    selectedIndices.push(index);
                }
            }
            renderBoard();
        }

        function deselectAll() {
            selectedIndices = [];
            renderBoard();
        }

        function shuffleGrid() {
            // Simple visual shuffle
            activeItems.sort(() => Math.random() - 0.5);
            selectedIndices = [];
            renderBoard();
        }

        function submitGuess() {
            if(selectedIndices.length !== 4) return;

            const selectedObjects = selectedIndices.map(i => activeItems[i]);
            const firstId = selectedObjects[0].groupId;
            const isMatch = selectedObjects.every(obj => obj.groupId === firstId);

            if(isMatch) {
                solvedGroups.push(firstId);
                selectedIndices = [];
                renderBoard();
                
                if(solvedGroups.length === 4) {
                    setTimeout(() => alert("🎉 Perfect! You found all connections!"), 300);
                }
            } else {
                // Check "One Away"
                const counts = {};
                selectedObjects.forEach(obj => {
                    counts[obj.groupId] = (counts[obj.groupId] || 0) + 1;
                });
                const isOneAway = Object.values(counts).some(c => c === 3);

                mistakes++;
                updateMistakesUI();

                const board = document.getElementById('game-board');
                board.classList.add('shake');
                setTimeout(() => board.classList.remove('shake'), 400);

                if(isOneAway) setTimeout(() => alert("One away..."), 400);

                if(mistakes >= MAX_MISTAKES) {
                    setTimeout(() => {
                        alert("Game Over! Better luck next time.");
                        solvedGroups = [0, 1, 2, 3]; // Reveal all
                        renderBoard();
                    }, 500);
                }
            }
        }

        function updateMistakesUI() {
            const remaining = MAX_MISTAKES - mistakes;
            let html = '';
            for(let i=0; i<MAX_MISTAKES; i++) {
                if(i < remaining) html += '<span class="mistake-dot">⚫</span> ';
                else html += '<span class="mistake-dot" style="opacity:0.2">⚫</span> ';
            }
            document.getElementById('mistakes-display').innerHTML = html;
        }
    </script>

</body>
