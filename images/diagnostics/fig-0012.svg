<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" height="250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Four Distributions</title>
<desc id="d">Four bell-shaped graphs in a row, numbered 1 to 4. Graph 1 has its peak on the left and a long tail on the right. Graph 2 has its peak on the right and a long tail on the left. Graph 3 is symmetric with one peak in the middle. Graph 4 has two separate peaks.</desc>
