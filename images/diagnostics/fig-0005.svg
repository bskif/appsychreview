<title id="t">Model of Memory Stages</title>
<desc id="d">Diagram with three boxes in a row: sensory memory, short-term memory, long-term memory. Arrow 1 points from sensory memory to short-term memory. Arrow 2 points from short-term memory to long-term memory. Arrow 3 points from long-term memory back to short-term memory. Arrow 4 loops from short-term memory back to itself.</desc>
