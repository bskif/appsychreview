<rect x="245" y="110" width="150" height="70" rx="6" fill="#eaf1fb" stroke="#1f4f9e" stroke-width="2"/><text x="320" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2d3a">Short-term memory</text>
