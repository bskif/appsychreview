<text x="330.0" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2d3a">Plan of an Experiment</text>
<rect x="20" y="125" width="130" height="70" rx="6" fill="#eaf1fb" stroke="#1f4f9e" stroke-width="2"/><text x="85.0" y="157.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">Volunteer</text><text x="85.0" y="175.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">participants</text>
<rect x="280" y="60" width="150" height="70" rx="6" fill="#eaf1fb" stroke="#1f4f9e" stroke-width="2"/><text x="355.0" y="92.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">Group receiving</text><text x="355.0" y="110.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">the treatment</text>
<rect x="280" y="190" width="150" height="70" rx="6" fill="#eaf1fb" stroke="#1f4f9e" stroke-width="2"/><text x="355.0" y="222.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">Group not receiving</text><text x="355.0" y="240.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">the treatment</text>
<rect x="510" y="125" width="130" height="70" rx="6" fill="#eaf1fb" stroke="#1f4f9e" stroke-width="2"/><text x="575.0" y="157.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">Compare results</text><text x="575.0" y="175.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f2d3a">on the outcome</text>
