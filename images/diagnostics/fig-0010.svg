<title id="t">Plan of an Experiment</title>
<desc id="d">Flow diagram. Volunteer participants on the left are split by arrows, labeled part 1, into two groups. Part 2 is the top group, which receives the treatment. Part 3 is the bottom group, which does not. Part 4 is a box on the right, to which both groups lead, where results on the outcome measure are compared.</desc>
