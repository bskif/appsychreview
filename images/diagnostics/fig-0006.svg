<title id="t">Cross Section of the Human Eye</title>
<desc id="d">Side view of an eye with light entering from the left. Part 1 is the lens near the front. Part 2 is the point at the back lower edge where the optic nerve leaves the eye. Part 3 is the light-sensitive layer lining the back of the eye. Part 4 is a small spot at the center of that layer directly behind the lens.</desc>
