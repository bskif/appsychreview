<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossary - Psych Review Hub</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6612537957463560" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        .glossary-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- CONTROL PANEL (Search, Toggle, Jump Links) --- */
        .controls-panel {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.98);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid var(--accent);
            border-radius: 8px;
            outline: none;
            transition: box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .search-input:focus {
            box-shadow: 0 0 8px rgba(95, 127, 255, 0.5);
        }

        /* Toggle Buttons */
        .toggle-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-btn {
            padding: 8px 15px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Jump Links Ribbon */
        .jump-ribbon {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .jump-link {
            text-decoration: none;
            color: #555;
            background: #f1f3f5;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .jump-link:hover {
            background: var(--accent);
            color: white;
        }

        /* --- GLOSSARY STRUCTURE --- */
        .main-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            scroll-margin-top: 180px; /* Prevents sticky header from covering titles */
        }

        .main-header {
            color: var(--primary);
            font-size: 1.8rem;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .sub-section {
            margin-bottom: 25px;
        }

        .sub-header {
            color: #555;
            font-size: 1.3rem;
            margin-bottom: 15px;
            background-color: #f1f3f5;
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 4px solid var(--accent);
        }

        /* --- TERM CARDS --- */
        .term-card {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: background 0.2s;
        }

        .term-card:hover {
            background-color: #f9fbfd;
            border-color: #dbe4ef;
        }

        .term-title {
            font-weight: bold;
            font-size: 1.15rem;
            color: #222;
            margin-bottom: 5px;
        }

        .term-def {
            color: #444;
            line-height: 1.5;
            font-size: 1rem;
        }

        /* Hide items dynamically during search */
        .hidden {
            display: none !important;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 600px) {
            .main-section { padding: 15px; scroll-margin-top: 220px; }
            .main-header { font-size: 1.5rem; }
            .sub-header { font-size: 1.1rem; }
            .search-input { padding: 10px; font-size: 1rem; }
            .toggle-btn { padding: 6px 12px; font-size: 0.85rem; }
            .jump-link { padding: 4px 8px; font-size: 0.8rem; }
        }
    </style>
</head>

    <div class="container glossary-container">
        <h1 style="text-align: center;">📖 Master Glossary</h1>
        <p style="text-align: center; margin-bottom: 20px;">Review all course terms below.</p>

        <div class="controls-panel">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search for a term or keyword..." onkeyup="filterGlossary()">
            
            <div class="toggle-wrapper">
                <button id="btn-unit" class="toggle-btn active" onclick="setMode('unit')">Sort by Unit</button>
                <button id="btn-alpha" class="toggle-btn" onclick="setMode('alpha')">Sort A-Z</button>
            </div>

            <div id="jump-ribbon" class="jump-ribbon">
                </div>
        </div>

        <div id="glossary-content">
            <h3 style="text-align: center; color: #777;">Loading terms...</h3>
        </div>
    </div>

    <script>
        let allTerms = [];
        let allTopics = [];
        let currentMode = 'unit'; // 'unit' or 'alpha'

        // 1. Fetch the data
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                if(data.topics) allTopics = data.topics;
                if(data.terms) {
                    allTerms = data.terms;
                    // Pre-sort all terms alphabetically just in case
                    allTerms.sort((a, b) => a.term.localeCompare(b.term));
                    buildGlossary();
                }
            })
            .catch(err => {
                document.getElementById('glossary-content').innerHTML = "<h3 style='color:red;'>Error loading glossary data.</h3>";
            });

        // 2. State Management
        function setMode(mode) {
            currentMode = mode;
            
            // Update button styles
            document.getElementById('btn-unit').classList.toggle('active', mode === 'unit');
            document.getElementById('btn-alpha').classList.toggle('active', mode === 'alpha');
            
            // Clear search when switching modes
            document.getElementById('search-input').value = '';
            
            buildGlossary();
        }

        // 3. Build the Interface
        function buildGlossary() {
            const container = document.getElementById('glossary-content');
            const ribbon = document.getElementById('jump-ribbon');
            container.innerHTML = '';
            ribbon.innerHTML = '';

            if (currentMode === 'unit') {
                renderByUnit(container, ribbon);
            } else {
                renderAlphabetical(container, ribbon);
            }
        }

        // --- RENDER MODE: UNIT / TOPIC ---
        function renderByUnit(container, ribbon) {
            const units = [...new Set(allTerms.map(t => t.unit))].sort();

            units.forEach(unit => {
                if(!unit) return;

                // Create Jump Link
                const safeUnitId = "sec-" + unit.replace(/[^a-zA-Z0-9]/g, '');
                const link = document.createElement('a');
                link.href = `#${safeUnitId}`;
                link.className = 'jump-link';
                // Extract just the number if it follows "Unit X" format, otherwise use whole string
                const match = unit.match(/Unit (\d+)/i);
                link.innerText = match ? `Unit ${match[1]}` : unit;
                ribbon.appendChild(link);

                // Create Unit Wrapper
                const unitDiv = document.createElement('div');
                unitDiv.className = 'main-section';
                unitDiv.id = safeUnitId;
                
                const unitHeader = document.createElement('h2');
                unitHeader.className = 'main-header';
                unitHeader.innerText = unit;
                unitDiv.appendChild(unitHeader);

                // Topics within Unit
                const unitTerms = allTerms.filter(t => t.unit === unit);
                const topics = [...new Set(unitTerms.map(t => t.topic))].sort();

                topics.forEach(topicId => {
                    if(!topicId) return;

                    const topicDiv = document.createElement('div');
                    topicDiv.className = 'sub-section';

                    const topicObj = allTopics.find(t => t.topic_id === topicId);
                    const topicName = topicObj ? `${topicObj.topic_id} ${topicObj.topic_title}` : topicId;

                    const topicHeader = document.createElement('h3');
                    topicHeader.className = 'sub-header';
                    topicHeader.innerText = topicName;
                    topicDiv.appendChild(topicHeader);

                    const topicTerms = unitTerms.filter(t => t.topic === topicId);

                    topicTerms.forEach(term => {
                        topicDiv.appendChild(createTermCard(term));
                    });

                    unitDiv.appendChild(topicDiv);
                });

                container.appendChild(unitDiv);
            });
        }

        // --- RENDER MODE: ALPHABETICAL ---
        function renderAlphabetical(container, ribbon) {
            // Group by first letter
            const grouped = {};
            allTerms.forEach(t => {
                if(!t.term) return;
                const firstLetter = t.term.charAt(0).toUpperCase();
                if (firstLetter >= 'A' && firstLetter <= 'Z') {
                    if (!grouped[firstLetter]) grouped[firstLetter] = [];
                    grouped[firstLetter].push(t);
                }
            });

            const letters = Object.keys(grouped).sort();

            letters.forEach(letter => {
                // Create Jump Link
                const link = document.createElement('a');
                link.href = `#sec-${letter}`;
                link.className = 'jump-link';
                link.innerText = letter;
                ribbon.appendChild(link);

                // Create Letter Wrapper
                const letterDiv = document.createElement('div');
                letterDiv.className = 'main-section';
                letterDiv.id = `sec-${letter}`;
                
                const letterHeader = document.createElement('h2');
                letterHeader.className = 'main-header';
                letterHeader.innerText = letter;
                letterDiv.appendChild(letterHeader);

                grouped[letter].forEach(term => {
                    letterDiv.appendChild(createTermCard(term));
                });

                container.appendChild(letterDiv);
            });
        }

        // Helper to generate standard term card
        function createTermCard(term) {
            const termCard = document.createElement('div');
            termCard.className = 'term-card';
            termCard.dataset.search = `${term.term} ${term.definition}`.toLowerCase();

            termCard.innerHTML = `
                <div class="term-title">${term.term}</div>
                <div class="term-def">${term.definition}</div>
            `;
            return termCard;
