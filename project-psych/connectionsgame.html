    <style>
        .game-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
        }
        .controls-area {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
        }
        .status-bar {
            margin: 15px 0;
            font-size: 1.2rem;
            color: #555;
        }
        .mistake-dot { color: #e74c3c; font-size: 1.5rem; }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Mobile Grid Adjustment */
        @media (max-width: 600px) {
            .grid-container {
                gap: 8px;
            }
        }

        .tile {
            background-color: #efefef;
            border: none;
            border-radius: 8px;
            padding: 20px 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        @media (max-width: 600px) {
            .tile {
                font-size: 0.85rem;
                padding: 10px 5px;
                min-height: 70px;
            }
        }

        .tile.selected {
            background-color: #5a5a5a;
            color: white;
        }
        
        /* Solved Group Colors */
        .solved-0 { background-color: #f1c40f; color: #333; cursor: default; } /* Yellow */
        .solved-1 { background-color: #2ecc71; color: white; cursor: default;} /* Green */
        .solved-2 { background-color: #3498db; color: white; cursor: default;} /* Blue */
        .solved-3 { background-color: #9b59b6; color: white; cursor: default;} /* Purple */

        .solved-row {
            grid-column: span 4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .solved-title { font-size: 1.2rem; margin-bottom: 5px; }
        .solved-items { font-weight: normal; font-size: 0.9rem; }

        .btn-group { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
        .action-btn {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
        .action-btn:hover { background: #eee; }
        .submit-btn { background: #333; color: white; }
        .submit-btn:hover { background: #111; }
    </style>
</head>

<div class="game-container">
    <h1>🔗 Connections</h1>
    <p>Group the terms into 4 categories of 4.</p>

    <div class="controls-area">
        <select id="unit-select" onchange="startGame()">
            <option value="all">All Units</option>
        </select>
        <div class="status-bar">
            Mistakes remaining: <span id="mistakes-display"></span>
        </div>
    </div>

    <div id="board" class="grid-container"></div>

    <div class="btn-group">
        <button class="action-btn" onclick="shuffleBoard()">Shuffle</button>
        <button class="action-btn" onclick="deselectAll()">Deselect All</button>
        <button class="action-btn submit-btn" onclick="submitGuess()">Submit</button>
    </div>
</div>

<script>
    let allConnections = [];
    let currentGroups = []; // Array of 4 group objects { theme, terms: [] }
    let boardItems = []; // Array of { term, groupIndex, selected, solved }
    let solvedGroups = []; // Array of groupIndexes that are solved
    let mistakes = 0;
    const MAX_MISTAKES = 4;

    // 1. Load Data
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            allConnections = data.connections;
            
            // Populate Unit Select
            const units = [...new Set(allConnections.map(c => c.unit))].sort();
            const select = document.getElementById('unit-select');
            units.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.innerText = u;
                select.appendChild(opt);
            });

            startGame();
        });

    function startGame() {
        const unit = document.getElementById('unit-select').value;
        let pool = unit === 'all' ? allConnections : allConnections.filter(c => c.unit === unit);
        
        if (pool.length < 4) {
            alert("Not enough groups in this unit to play!");
            return;
        }

        // Shuffle and pick 4 groups
        pool.sort(() => Math.random() - 0.5);
        currentGroups = pool.slice(0, 4).map(c => ({
            theme: c.theme,
            terms: [c.item_1, c.item_2, c.item_3, c.item_4]
        }));

        // Flatten to board items
        boardItems = [];
        currentGroups.forEach((group, index) => {
            group.terms.forEach(term => {
                boardItems.push({ term: term, groupIndex: index, selected: false });
            });
        });

        solvedGroups = [];
        mistakes = 0;
        shuffleBoard();
        updateMistakesUI();
    }

    function shuffleBoard() {
        // Only shuffle unsolved items
        const unsolved = boardItems.filter(item => !solvedGroups.includes(item.groupIndex));
        unsolved.sort(() => Math.random() - 0.5);
        
        let unsolvedIndex = 0;
        boardItems = boardItems.map(item => {
            if (solvedGroups.includes(item.groupIndex)) return item;
            return unsolved[unsolvedIndex++];
        });
        
        renderBoard();
    }

    function deselectAll() {
        boardItems.forEach(item => item.selected = false);
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';

        // 1. Render Solved Groups First (taking up whole rows)
        solvedGroups.forEach(groupIndex => {
            const group = currentGroups[groupIndex];
            const div = document.createElement('div');
            div.className = `solved-row solved-${groupIndex}`;
            div.innerHTML = `
                <div class="solved-title">${group.theme.toUpperCase()}</div>
                <div class="solved-items">${group.terms.join(', ')}</div>
            `;
            board.appendChild(div);
        });

        // 2. Render Unsolved Tiles
        boardItems.forEach((item, index) => {
            if (!solvedGroups.includes(item.groupIndex)) {
                const btn = document.createElement('div');
                btn.className = `tile ${item.selected ? 'selected' : ''}`;
                btn.innerText = item.term;
                btn.onclick = () => toggleSelect(index);
                board.appendChild(btn);
            }
        });

        // Add shake animation class logic if needed later
    }

    function toggleSelect(index) {
        const selectedCount = boardItems.filter(i => i.selected).length;
        
        if (boardItems[index].selected) {
            boardItems[index].selected = false;
        } else if (selectedCount < 4) {
            boardItems[index].selected = true;
        }
        renderBoard();
    }

    function submitGuess() {
        const selectedItems = boardItems.filter(i => i.selected);
        if(selectedItems.length !== 4) return;

        // Check if all 4 belong to the same group
        const firstGroup = selectedItems[0].groupIndex;
        const isCorrect = selectedItems.every(i => i.groupIndex === firstGroup);

        if(isCorrect) {
            solvedGroups.push(firstGroup);
            deselectAll(); // Re-renders board with new solved row
            
            if(solvedGroups.length === 4) {
                setTimeout(() => alert("Perfect! You found all connections! 🎉"), 300);
            }
        } else {
            // Check if 3 are correct (One away)
            const groupCounts = {};
            selectedItems.forEach(i => {
                groupCounts[i.groupIndex] = (groupCounts[i.groupIndex] || 0) + 1;
            });
            const isOneAway = Object.values(groupCounts).includes(3);

            mistakes++;
            updateMistakesUI();
            
            // Visual feedback
            const tiles = document.querySelectorAll('.tile.selected');
            tiles.forEach(t => {
                t.style.transform = 'translateY(-5px)';
                setTimeout(() => t.style.transform = 'translateY(0)', 150);
            });

            setTimeout(() => deselectAll(), 400);

            if(isOneAway) setTimeout(() => alert("One away..."), 400);

            if(mistakes >= MAX_MISTAKES) {
                setTimeout(() => {
                    alert("Game Over! Better luck next time.");
                    solvedGroups = [0, 1, 2, 3]; // Reveal all
                    renderBoard();
                }, 500);
            }
        }
    }

    function updateMistakesUI() {
        const remaining = MAX_MISTAKES - mistakes;
        let html = '';
        for(let i=0; i<MAX_MISTAKES; i++) {
            if(i < remaining) html += '<span class="mistake-dot">⚫</span> ';
            else html += '<span class="mistake-dot" style="opacity:0.2">⚫</span> ';
        }
        document.getElementById('mistakes-display').innerHTML = html;
    }
</script>
